# Checagens que rodam automaticamente antes de cada commit.
# Instalar uma vez:  .\.venv\Scripts\python.exe -m pre_commit install
# Rodar em tudo:     .\.venv\Scripts\python.exe -m pre_commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # o template do CloudFormation usa tags !Sub/!If
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  # ruff e mypy usam as versões já instaladas no .venv (as mesmas da CI)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formatação)
        entry: python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (tipos)
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
