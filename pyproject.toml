[build-system]
requires = ["setuptools>=77"]  # 77+ entende `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "finops-aws"
version = "1.1.0"
description = "Monitoramento de custos AWS multi-conta: custos, anomalias e recomendações de economia."
readme = "README.md"
license = "MIT"
authors = [{ name = "pabloaugustoti" }]
requires-python = ">=3.12"
# [crt] é necessário para usar as credenciais do `aws login`
dependencies = ["boto3[crt]>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13", "pre-commit>=4"]

[project.scripts]
finops = "finops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finops.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ---------- qualidade ----------

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # estilo (pycodestyle)
    "F",        # erros reais: nomes indefinidos, imports não usados (pyflakes)
    "I",        # ordem dos imports (isort)
    "B",        # armadilhas comuns (bugbear)
    "UP",       # sintaxe moderna do Python (pyupgrade)
    "SIM",      # simplificações
    "C4",       # list/dict comprehensions
    "RET",      # returns
    "PT",       # boas práticas de pytest
    "S",        # segurança (bandit)
    "N",        # nomes (pep8-naming)
]
ignore = [
    "S101",     # assert é o normal nos testes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.ruff.lint.isort]
known-first-party = ["finops"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["finops"]
branch = true

[tool.coverage.report]
fail_under = 90  # a CI falha se a cobertura cair abaixo disso
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
