name: testes

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório: a CI não precisa (e não recebe) credenciais da AWS.
permissions:
  contents: read

jobs:
  qualidade:
    name: lint, formatação e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: ruff (lint)
        run: python -m ruff check --output-format=github
      - name: ruff (formatação)
        run: python -m ruff format --check
      - name: mypy (tipos)
        run: python -m mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: Testes com cobertura (mínimo 90%)
        run: python -m pytest -q --cov --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
      - name: Fumaça da CLI (dados de exemplo, sem AWS)
        run: |
          python -m finops resumo --dias 7
          python -m finops recomendacoes
          python -m finops anomalias
          python -m finops relatorio --saida relatorio.md
      - name: Publicar o relatório semanal de exemplo
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semanal-exemplo
          path: relatorio.md
