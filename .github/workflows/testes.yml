name: testes

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório: a CI não precisa (e não recebe) credenciais da AWS.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: Rodar testes
        run: python -m pytest -q
      - name: Fumaça da CLI (dados de exemplo, sem AWS)
        run: |
          python -m finops resumo --dias 7
          python -m finops recomendacoes
          python -m finops anomalias
          python -m finops relatorio --saida relatorio.md
      - name: Publicar o relatório semanal de exemplo
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semanal-exemplo
          path: relatorio.md
